# astro-update.yml
#
# Weekly: check whether Soroushnk/Astro's main has moved past the pinned
# SHA in main.sh. If it has, open a pull request updating the default
# ASTRO_REF.
#
# NOTE: To allow this workflow to open PRs on the default branch, enable
#   "Allow GitHub Actions to create and approve pull requests"
# in Settings -> Actions -> General of this repository.

name: astro-update

on:
  schedule:
    # Runs weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allow manual triggering
    inputs: {}

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  check-astro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current Astro main SHA
        id: astro
        run: |
          SHA="$(git ls-remote https://github.com/Soroushnk/Astro.git refs/heads/main | awk '{print $1}')"
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve Astro main SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Astro main is now: $SHA"

      - name: Compare with pinned SHA in main.sh
        id: compare
        run: |
          CURRENT="$(grep -oP 'ASTRO_REF="\K[a-f0-9]{7,40}' main.sh | head -1)"
          REMOTE="${{ steps.astro.outputs.sha }}"
          echo "Pinned in main.sh: $CURRENT"
          echo "Astro main:        $REMOTE"
          if [ "$CURRENT" != "$REMOTE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SHA has moved; will open a PR."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date; nothing to do."
          fi

      - name: Update ASTRO_REF in main.sh
        if: steps.compare.outputs.changed == 'true'
        run: |
          NEW_SHA="${{ steps.astro.outputs.sha }}"
          # Replace the default pin only (the line with ${ASTRO_REF:-...})
          sed -i "s|ASTRO_REF=\"\${ASTRO_REF:-[a-f0-9]*}\"|ASTRO_REF=\"\${ASTRO_REF:-${NEW_SHA}}\"|" main.sh
          echo "Updated main.sh:"
          grep 'ASTRO_REF=' main.sh
          git config user.name  "github-actions[bot]"
          git config user.email "418882797+github-actions[bot]@users.noreply.github.com"
          git add main.sh
          git commit -m "Bump Astro ref to ${NEW_SHA:0:7}"

      - name: Open pull request
        if: steps.compare.outputs.changed == 'true'
        run: |
          NEW_SHA="${{ steps.astro.outputs.sha }}"
          BRANCH="astro-ref-${NEW_SHA:0:7}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --title "Bump Astro ref to ${NEW_SHA:0:7}" \
            --body "Automatic Astro ref update.

          Astro main moved from the previously pinned SHA to \`${NEW_SHA:0:7}\`.
          Please review the new commit before merging.

          Astro repo: https://github.com/Soroushnk/Astro" \
            --head "$BRANCH"
