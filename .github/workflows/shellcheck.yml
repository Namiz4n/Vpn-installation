name: shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/**'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run ShellCheck on our own scripts (strict)
        run: shellcheck main.sh install_openvpn.sh tools/*.sh

      - name: Run ShellCheck on wireguard-install.sh (error only)
        run: shellcheck --severity=error wireguard-install.sh

  config-test:
    name: Config validation (ocserv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ocserv
        run: |
          sudo apt-get update
          sudo apt-get install -y ocserv

      - name: Validate generated ocserv config with ocserv --test-config
        run: |
          # Generate the config without running the full installer.
          bash tools/ocserv.sh print-config > /tmp/ocserv-test.conf
          echo "--- generated ocserv.conf ---"
          cat /tmp/ocserv-test.conf
          # The certificate files referenced by the config must exist for
          # --test-config to pass; create throwaway self-signed certs.
          sudo mkdir -p /etc/ocserv/ssl
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
            -keyout /etc/ocserv/ssl/server-key.pem \
            -out  /etc/ocserv/ssl/server-cert.pem \
            -subj "/CN=vpn.local"
          # The password file referenced by the config must exist.
          sudo touch /etc/ocserv/ocpasswd
          # The socket-file path must exist as a directory (it lives under
          # /run, which is present on the runner).
          sudo mkdir -p /run
          # Run the test STRICTLY: capture both stdout and stderr, and fail
          # if the exit code is non-zero OR if an "unknown option" warning
          # was printed. No more `|| true` swallowing the real failure.
          set -o pipefail
          rc=0
          out="$(sudo ocserv -c /tmp/ocserv-test.conf --test-config 2>&1)" || rc=$?
          echo "$out"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::ocserv --test-config exited with code $rc"
            exit 1
          fi
          if echo "$out" | grep -qi 'unknown option'; then
            echo "::error::ocserv --test-config reported an unknown option"
            exit 1
          fi
          echo "ocserv config validated (exit 0, no unknown options)."

  pptp-dryrun:
    name: PPTP dry-run + availability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check pptpd availability on this release
        run: |
          # On releases without pptpd (Ubuntu 24.04+), the tool must refuse
          # to install but print-config must still work (it does not touch
          # the package manager).
          bash tools/pptp.sh print-config | tee /tmp/pptp-dryrun.txt
          # Basic sanity: the generated pptpd.conf + ppp options must be
          # present and well-formed.
          grep -q 'option /etc/ppp/pptpd-options' /tmp/pptp-dryrun.txt \
            || { echo "::error::pptpd.conf missing the option directive"; exit 1; }
          grep -q 'require-mppe-128' /tmp/pptp-dryrun.txt \
            || { echo "::error::ppp options missing require-mppe-128"; exit 1; }
          grep -q 'require-mschap-v2' /tmp/pptp-dryrun.txt \
            || { echo "::error::ppp options missing require-mschap-v2"; exit 1; }
          grep -q 'localip' /tmp/pptp-dryrun.txt \
            || { echo "::error::pptpd.conf missing localip"; exit 1; }
          if apt-cache show pptpd >/dev/null 2>&1; then
            echo "pptpd is available on this release."
          else
            echo "::warning::pptpd is not available on this release (expected on Ubuntu 24.04+)."
            echo "The install path will refuse on this release; print-config still validated."
          fi
          echo "PPTP print-config validated."

  l2tp-dryrun:
    name: L2TP/IPsec dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate generated L2TP/IPsec config
        run: |
          # print-config writes nothing; it renders every file the install
          # path would create. We install the packages so the generated
          # config can be validated by the real validator (ipsec verify /
          # swanctl verify where available) after we drop the files in.
          sudo apt-get update
          sudo apt-get install -y strongswan xl2tpd ppp || true
          bash tools/l2tp.sh print-config > /tmp/l2tp-dryrun.txt
          echo "--- generated files ---"
          cat /tmp/l2tp-dryrun.txt
          # Structural sanity checks (no real IPsec daemon is started in CI).
          grep -q 'conn l2tp' /tmp/l2tp-dryrun.txt \
            || { echo "::error::ipsec.conf missing 'conn l2tp'"; exit 1; }
          grep -q 'rightsourceip=%config' /tmp/l2tp-dryrun.txt \
            || { echo "::error::ipsec.conf missing rightsourceip=%config"; exit 1; }
          grep -q 'listen-addr' /tmp/l2tp-dryrun.txt \
            || { echo "::error::xl2tpd.conf missing listen-addr"; exit 1; }
          grep -q 'ipsec saref = yes' /tmp/l2tp-dryrun.txt \
            || { echo "::error::xl2tpd.conf missing 'ipsec saref = yes'"; exit 1; }
          grep -q 'require-mschap-v2' /tmp/l2tp-dryrun.txt \
            || { echo "::error::ppp options missing require-mschap-v2"; exit 1; }
          echo "L2TP/IPsec print-config validated (structural checks passed)."

  gre-dryrun:
    name: GRE dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate generated GRE config
        run: |
          # print-config writes nothing and emits the exact ip commands +
          # systemd unit + the peer-side pairing command.
          bash tools/gre.sh print-config --name gre0 \
            --local 203.0.113.1 --remote 203.0.113.2 \
            --inner-subnet 10.10.0.0/24 > /tmp/gre-dryrun.txt
          echo "--- generated GRE commands ---"
          cat /tmp/gre-dryrun.txt
          grep -q 'ip link add gre0 type gre local 203.0.113.1 remote 203.0.113.2' /tmp/gre-dryrun.txt \
            || { echo "::error::gre link-add line missing/malformed"; exit 1; }
          grep -q 'ip addr add 10.10.0.1/30 peer 10.10.0.2 dev gre0' /tmp/gre-dryrun.txt \
            || { echo "::error::gre inner /30 addressing missing"; exit 1; }
          grep -q 'gre-gre0.service' /tmp/gre-dryrun.txt \
            || { echo "::error::systemd unit name missing"; exit 1; }
          grep -q 'bash gre.sh add gre0 --local 203.0.113.2 --remote 203.0.113.1' /tmp/gre-dryrun.txt \
            || { echo "::error::peer-side pairing command missing"; exit 1; }
          echo "GRE print-config validated."

  gre-functional:
    name: GRE functional test (netns + veth)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build a GRE tunnel from the same generator and ping across it
        run: |
          set -uo pipefail
          # The runner's kernel may not have ip_gre built in or loadable.
          # If we cannot load it, fall back to dry-run-only (documented).
          if ! modprobe ip_gre 2>/dev/null; then
            echo "::warning::ip_gre module could not be loaded on this runner."
            echo "Falling back to dry-run validation only."
            bash tools/gre.sh print-config --name gre0 \
              --local 203.0.113.1 --remote 203.0.113.2 \
              --inner-subnet 10.10.0.0/24 >/dev/null
            echo "GRE functional test skipped (kernel limitation); dry-run passed."
            exit 0
          fi
          # Two netns connected by a veth pair, each with a /30 outer IP so
          # the GRE tunnel endpoints (203.0.113.1 / 203.0.113.2) are
          # routeable between them.
          sudo ip netns add gre-test-a
          sudo ip netns add gre-test-b
          sudo ip link add veth-a type veth peer name veth-b
          sudo ip link set veth-a netns gre-test-a
          sudo ip link set veth-b netns gre-test-b
          sudo ip netns exec gre-test-a ip addr add 203.0.113.1/30 dev veth-a
          sudo ip netns exec gre-test-b ip addr add 203.0.113.2/30 dev veth-b
          sudo ip netns exec gre-test-a ip link set veth-a up
          sudo ip netns exec gre-test-b ip link set veth-b up

          # Build the tunnel on side A using the tool's own command
          # generator (the single source of truth).
          local_out="$(bash tools/gre.sh print-config --name gre0 \
            --local 203.0.113.1 --remote 203.0.113.2 \
            --inner-subnet 10.10.0.0/24)"
          # Side A: link + inner address (from the generator output).
          sudo ip netns exec gre-test-a bash -c "$(grep 'ip link add' <<< "$local_out" | sed 's/^ *//')"
          sudo ip netns exec gre-test-a bash -c "$(grep 'ip addr add' <<< "$local_out" | sed 's/^ *//')"
          sudo ip netns exec gre-test-a ip link set gre0 up
          # Side B (the pairing command, swapped; the generator emits it
          # verbatim so both ends use the same code path).
          peer_cmd="$(grep 'bash gre.sh add' <<< "$local_out")"
          echo "Peer-side command (for reference): $peer_cmd"
          sudo ip netns exec gre-test-b bash -c "
            ip link add gre0 type gre local 203.0.113.2 remote 203.0.113.1 mtu 1476
            ip addr add 10.10.0.2/30 peer 10.10.0.1 dev gre0
            ip link set gre0 up"
          # Ping across the inner addresses.
          echo "--- ping from A (10.10.0.1) to B (10.10.0.2) ---"
          if sudo ip netns exec gre-test-a ping -c 1 -W 3 10.10.0.2; then
            echo "GRE functional test passed: ping crossed the tunnel."
          else
            echo "::error::GRE ping failed; tunnel did not come up."
            exit 1
          fi
          # Cleanup.
          sudo ip netns del gre-test-a || true
          sudo ip netns del gre-test-b || true
