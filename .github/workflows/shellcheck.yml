name: shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
  pull_request:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d9cc13a8943999264a97414c2ca7412a # v4.5.0

      - name: Run ShellCheck on our own scripts (strict)
        uses: ludeeus/action-shellcheck@master
        with:
          file: main.sh

      - name: Run ShellCheck on install_openvpn.sh (strict)
        uses: ludeeus/action-shellcheck@master
        with:
          file: install_openvpn.sh

      - name: Run ShellCheck on wireguard-install.sh (error only)
        uses: ludeeus/action-shellcheck@master
        with:
          file: wireguard-install.sh
          severity: error
