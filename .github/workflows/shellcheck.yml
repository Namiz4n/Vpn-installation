name: shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/**'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run ShellCheck on our own scripts (strict)
        run: shellcheck main.sh install_openvpn.sh tools/*.sh

      - name: Run ShellCheck on wireguard-install.sh (error only)
        run: shellcheck --severity=error wireguard-install.sh

  config-test:
    name: Config validation (ocserv + nginx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ocserv and nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y ocserv nginx

      - name: Validate generated ocserv config with ocserv --test-config
        run: |
          # Generate the config without running the full installer.
          bash tools/ocserv.sh print-config > /tmp/ocserv-test.conf
          echo "--- generated ocserv.conf ---"
          cat /tmp/ocserv-test.conf
          # The certificate files referenced by the config must exist for
          # --test-config to pass; create throwaway self-signed certs.
          sudo mkdir -p /etc/ocserv/ssl
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
            -keyout /etc/ocserv/ssl/server-key.pem \
            -out  /etc/ocserv/ssl/server-cert.pem \
            -subj "/CN=vpn.local"
          # The password file referenced by the config must exist.
          sudo touch /etc/ocserv/ocpasswd
          # The socket-file path must exist as a directory (it lives under
          # /run, which is present on the runner).
          sudo mkdir -p /run
          # Run the test STRICTLY: capture both stdout and stderr, and fail
          # if the exit code is non-zero OR if an "unknown option" warning
          # was printed. No more `|| true` swallowing the real failure.
          set -o pipefail
          rc=0
          out="$(sudo ocserv -c /tmp/ocserv-test.conf --test-config 2>&1)" || rc=$?
          echo "$out"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::ocserv --test-config exited with code $rc"
            exit 1
          fi
          if echo "$out" | grep -qi 'unknown option'; then
            echo "::error::ocserv --test-config reported an unknown option"
            exit 1
          fi
          echo "ocserv config validated (exit 0, no unknown options)."

      - name: Validate generated nginx server block with nginx -t
        run: |
          # Generate a self-contained nginx.conf with the server block inline.
          bash tools/reverse-proxy.sh print-config example.com 127.0.0.1:8080 8080 > /tmp/nginx-test.conf
          echo "--- generated nginx.conf ---"
          cat /tmp/nginx-test.conf
          # Run nginx -t STRICTLY: it must exit 0 on its own. No fallback
          # rewriting; if the generated block is wrong, the job fails.
          set -o pipefail
          rc=0
          out="$(sudo nginx -t -c /tmp/nginx-test.conf 2>&1)" || rc=$?
          echo "$out"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::nginx -t failed with exit code $rc"
            echo "$out"
            exit 1
          fi
          echo "nginx config validated (nginx -t exit 0)."
